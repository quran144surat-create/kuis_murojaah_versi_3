(function(){try{
  var s=Math.min(screen.width,screen.height), fis=s*(window.devicePixelRatio||1);
  var sentuh=navigator.maxTouchPoints>0&&window.matchMedia&&matchMedia("(pointer:coarse)").matches;

  document.documentElement.className+=(hp?" hp":" lebar");
}catch(e){document.documentElement.className+=" hp";}})();

      var ada=(cp[n]!==undefined&&ow[cp[n]]!==undefined), pi=ada?ow[cp[n]]:0;
      toJpg(f).then(b64).then(function(d){var o={a:"prof",pin:PIN,n:n,d:d}; return ada?cpost(o,pi).then(function(j){j.ai=pi;return j;}):kirim(o,0);}).then(function(j){
        if(!j.ok) return bad(j);
        pi=j.ai; cp[n]=j.i; ow[j.i]=pi; delete cb[j.i]; refresh();
      }).catch(function(){alert("Gagal mengunggah.");}).then(function(){sp.disabled=false;sp.textContent="Ganti foto profil";});
    });
    Promise.all(CUS.map(function(u,i){return fetch(u+"?a=l").then(function(r){return r.json();}).then(function(j){return {i:i,j:j};}).catch(function(){return null;});})).then(function(rs){
      cm={};cp={};
      rs.forEach(function(r){
        if(!r||!r.j) return; var j=r.j;
        Object.keys(j.k||{}).forEach(function(d){cm[d]=cm[d]||[];j.k[d].forEach(function(f){ow[f.i]=r.i;if(f.p)ow[f.p]=r.i;cm[d].push(f);});});
        Object.keys(j.p||{}).forEach(function(n){cp[n]=j.p[n];ow[j.p[n]]=r.i;});
        if(r.i===0&&j.c&&typeof j.c==="object") Object.keys(j.c).forEach(function(d){if(typeof j.c[d]==="string") COV[d]=j.c[d];});
      });
      refresh();
    });
  })();
  S=parse(); initHist(); show();
})();
/* ===== Ubin foto: tandai selesai dimuat atau gagal (dipakai gaya kilau dan kartu "Belum tersedia") ===== */
document.addEventListener("load",function(e){
  var t=e.target; if(!t||t.tagName!=="IMG"||!t.closest) return;
  var p=t.closest(".st,.ph,.day.has"); if(!p) return;
  p.classList.add("ok"); p.classList.remove("gagal");
},true);
document.addEventListener("error",function(e){
  var t=e.target; if(!t||t.tagName!=="IMG"||!t.closest) return;
  var p=t.closest(".st,.ph,.day.has"); if(!p) return;
  var s0=t.src;
  /* bila pengganti (foto asli/thumbnail) sudah dipasang, jangan tandai gagal dulu */
  setTimeout(function(){ if(t.src===s0) p.classList.add("gagal"); },0);
},true);
["copy","cut","contextmenu","selectstart","dragstart"].forEach(function(n){
  document.addEventListener(n,function(e){e.preventDefault();});
});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&/^[acxsup]$/i.test(e.key))e.preventDefault();
});
/* ===== Tombol instal aplikasi: tampil hanya bila belum terpasang ===== */
(function(){
  var w=document.getElementById("insw"), b=document.getElementById("ins");
  var h=document.getElementById("iosh"), hx=document.getElementById("ioshx"), dp=null;
  if(!w||!b) return;
  function terpasang(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  function tampil(){
    if(terpasang()) return;
    w.hidden=false;
  }
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;tampil();});
  window.addEventListener("appinstalled",function(){dp=null;w.hidden=true;});
  if(ios&&!terpasang()) tampil();
  b.addEventListener("click",function(){
    if(dp){
      dp.prompt();
      dp.userChoice.then(function(c){dp=null;if(c&&c.outcome==="accepted")w.hidden=true;}).catch(function(){});
    }else if(ios){h.hidden=false;hx.focus();}
  });
  hx.addEventListener("click",function(){h.hidden=true;});
  h.addEventListener("click",function(e){if(e.target===h)h.hidden=true;});
  document.addEventListener("keydown",function(e){if(!h.hidden&&e.key==="Escape")h.hidden=true;});
})();
/* ===== Tab kaca: indikator bergeser, getar halus saat menekan, putaran di tombol instal ===== */
(function(){
  var t=document.getElementById("tabs"); if(!t) return;
  var g=t.querySelector(".geser"), siap=false;
  var kurang=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  function pos(){
    var b=t.querySelector('button[aria-selected="true"]');
    if(!g||!b||t.hidden||!b.offsetWidth) return;
    g.style.width=b.offsetWidth+"px";
    g.style.transform="translateX("+b.offsetLeft+"px)";
    if(!siap){siap=true;requestAnimationFrame(function(){requestAnimationFrame(function(){g.classList.add("siap");});});}
  }
  try{new MutationObserver(pos).observe(t,{attributes:true,subtree:true,attributeFilter:["aria-selected","hidden"]});}catch(e){}
  window.addEventListener("resize",pos);
  window.addEventListener("load",pos);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(pos);
  pos();
  /* getar singkat (Android) */
  document.addEventListener("pointerdown",function(e){
    if(kurang||!navigator.vibrate||!e.target.closest) return;
    if(e.target.closest("button.b")) try{navigator.vibrate(8);}catch(x){}
  },true);
  /* tombol instal: putaran kecil sesaat */
  var ins=document.getElementById("ins");
  if(ins) ins.addEventListener("click",function(){ins.classList.add("sibuk");setTimeout(function(){ins.classList.remove("sibuk");},1000);});
})();
